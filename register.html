<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Register for University TechFest 2026 and participate in technology competitions, workshops, and talks."
    />

    <title>University TechFest 2026 | Register</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/main.js" defer></script>
    <script src="js/events-data.js" defer></script>
    <script src="js/register.js" defer></script>
  </head>

  <body>
    <!-- Website Header -->
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a href="index.html" class="logo"> TechFest<span>2026</span> </a>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="register.html" aria-current="page">Register</a>
        </div>

        <button
          type="button"
          id="themeToggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >
          Toggle Theme
        </button>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Registration Introduction -->
      <section class="page-hero container" aria-labelledby="register-title">
        <p class="eyebrow">JOIN THE EXPERIENCE</p>

        <h1 id="register-title">TechFest Registration</h1>

        <p>Complete the form below to register for University TechFest 2026.</p>
      </section>

      <!-- Registration Form Section -->
      <section
        class="registration-section section-padding"
        aria-labelledby="form-title"
      >
        <div class="container">
          <div class="registration-card">
            <h2 id="form-title">Participant Information</h2>

            <form id="registrationForm" novalidate>
              <!-- Full Name -->
              <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="Enter your full name"
                  required
                  minlength="3"
                  autocomplete="name"
                />

                <small
                  class="field-error"
                  id="fullNameError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- University Email -->
              <div class="form-group">
                <label for="universityEmail">University Email</label>

                <input
                  type="email"
                  id="universityEmail"
                  name="universityEmail"
                  placeholder="student@university.edu.pk"
                  required
                  autocomplete="email"
                />

                <small
                  class="field-error"
                  id="universityEmailError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Registration Number -->
              <div class="form-group">
                <label for="registrationNumber">Registration Number</label>

                <input
                  type="text"
                  id="registrationNumber"
                  name="registrationNumber"
                  placeholder="F2024266159"
                  required
                  pattern="[FS][0-9]{10}"
                />

                <small
                  class="field-error"
                  id="registrationNumberError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Event Selection -->
              <div class="form-group">
                <label for="selectedEvent">Select Event</label>
                <select id="selectedEvent" name="selectedEvent" required>
                  <option value="">Choose an event</option>
                </select>

                <small
                  class="field-error"
                  id="selectedEventError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Team Size -->
              <div class="form-group">
                <label for="teamSize">Team Size</label>

                <select id="teamSize" name="teamSize" required>
                  <option value="">Select team size</option>
                  <option value="1">1 Member</option>
                  <option value="2">2 Members</option>
                  <option value="3">3 Members</option>
                  <option value="4">4 Members</option>
                </select>

                <small
                  class="field-error"
                  id="teamSizeError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Participation Type -->
              <fieldset class="form-group">
                <legend>Participation Type</legend>

                <label>
                  <input
                    type="radio"
                    name="participation"
                    value="individual"
                    required
                  />
                  Individual
                </label>

                <label>
                  <input type="radio" name="participation" value="team" />
                  Team
                </label>

                <small
                  class="field-error"
                  id="participationError"
                  aria-live="polite"
                ></small>
              </fieldset>

              <!-- T-Shirt Size -->
              <div class="form-group">
                <label for="tshirtSize">T-Shirt Size</label>

                <select id="tshirtSize" name="tshirtSize" required>
                  <option value="">Select your size</option>
                  <option value="S">Small</option>
                  <option value="M">Medium</option>
                  <option value="L">Large</option>
                  <option value="XL">Extra Large</option>
                </select>

                <small
                  class="field-error"
                  id="tshirtSizeError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Terms and Conditions -->
              <div class="form-group">
                <label class="terms-label">
                  <input type="checkbox" id="terms" name="terms" required />

                  I agree to the terms and conditions.
                </label>

                <small
                  class="field-error"
                  id="termsError"
                  aria-live="polite"
                ></small>
              </div>

              <!-- Form Submission -->
              <button type="submit" class="btn btn-primary">
                Submit Registration
              </button>

              <!-- Form Status -->
              <p
                id="formMessage"
                class="form-message"
                role="status"
                aria-live="polite"
              ></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- Website Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 University TechFest. All rights reserved.</p>

        <p>Designed for technology enthusiasts and innovators.</p>
      </div>
    </footer>
  </body>
</html>
